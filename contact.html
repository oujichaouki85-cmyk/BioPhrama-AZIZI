<!-- CHAT SIMPLE -->
<div id="chatBox">
  <h3>Chat en ligne</h3>
  <div id="messages"></div>
  <input type="text" id="msg" placeholder="Ecrire message">
  <button onclick="sendMsg()">Envoyer</button>
</div>

<script>
function sendMsg() {
  const input = document.getElementById("msg");
  const box = document.getElementById("messages");

  if (input.value !== "") {
    box.innerHTML += "<p>Vous: " + input.value + "</p>";
    box.innerHTML += "<p>Support: Merci, nous vous répondrons.</p>";
    input.value = "";
  }
}
</script>
